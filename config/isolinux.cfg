# ---------------------------------------------------------------
# RetroCore Linux - menu di avvio (base: CorePlus @TC_VERSION@)
# Ottimizzato per PC ~2009: 32 bit, 512 MB - 2 GB di RAM, GPU Intel/Nouveau dell'epoca.
# ---------------------------------------------------------------

default retro
timeout 50              # 5 secondi
prompt 1
display boot.msg        # mantenuto da CorePlus se presente
F1 boot.msg
F2 f2

MENU TITLE RetroCoreOS - PC vecchi edition

LABEL retro
  MENU LABEL RetroCoreOS (default)
  TEXT HELP
                       Modalita principale: copia i file in RAM se c'e' spazio (piu' reattivo),
                       usa la directory cde/ sulla chiavetta/CD per le estensioni.
  ENDTEXT
  KERNEL @ORIG_KERNEL@
  APPEND @ORIG_APPEND@ host=retrocore loglevel=3

LABEL ram512
  MENU LABEL RetroCoreOS (PC con 512 MB di RAM)
  TEXT HELP
                       Non copia il sistema in RAM (copy2fs off): parte piu' lentamente
                       ma resta fluide anche su macchine molto anziane.
  ENDTEXT
  KERNEL @ORIG_KERNEL@
  APPEND @ORIG_APPEND@ host=retrocore loglevel=3 tce=copy2fs

LABEL video
  MENU LABEL RetroCoreOS (modalita' video sicura - schermo nero? usa questa)
  TEXT HELP
                       Disattiva KMS/modeset dei driver nouveau e i915,
                       la scorciatoia giusta quando lo schermo resta nero all'avvio.
  ENDTEXT
  KERNEL @ORIG_KERNEL@
  APPEND @ORIG_APPEND@ host=retrocore loglevel=3 nomodeset i915.modeset=0 nouveau.modeset=0

LABEL text
  MENU LABEL RetroCoreOS (solo console - nessun ambiente grafico)
  TEXT HELP
                       Avvia senza X: utile per ricaricare il driver video adatto
                       (tce-load -wi Xorg-7.7) o per recupero dati.
  ENDTEXT
  KERNEL @ORIG_KERNEL@
  APPEND @ORIG_APPEND@ host=retrocore loglevel=3 text

LABEL coreplus
  MENU LABEL Tiny Core CorePlus originale
  TEXT HELP
                       L'avvio di CorePlus non modificato, di riserva.
  ENDTEXT
  KERNEL @ORIG_KERNEL@
  APPEND @ORIG_APPEND@

LABEL local
  MENU LABEL Avvia il disco fisso (se gia' installato)
  LOCALBOOT 0
